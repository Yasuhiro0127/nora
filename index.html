<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://noralive-vercel.vercel.app/">
    <title>ただいまメンテナンス中 - 野良ライヴ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d, #6bcf7f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.8;
            opacity: 0.9;
            margin-bottom: 1rem;
        }

        .cta-button {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 15px 40px;
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.5);
        }

        .note {
            margin-top: 2rem;
            font-size: 0.9rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">野良ライヴ</div>
        <h1>ただいまサーバー移行のためメンテナンス中です</h1>
        <p>新しいサーバーへの移行作業を行っております。<br>ご不便をおかけして申し訳ございません。</p>
        <p>5秒後に新しいサイトへ自動的に移動します。</p>
        <a class="cta-button" href="https://noralive-vercel.vercel.app/">新しいサイトはこちら</a>
        <p class="note">移動しない場合は上のボタンをクリックしてください。</p>
    </div>
</body>

</html>
